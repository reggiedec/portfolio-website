<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#f1ebe1"/>
  <g transform="translate(5 4)">
    <!-- 7×8 pixel floppy · matches PixelIcon "floppy" -->
    <g fill="#1a1a1a">
      <rect x="0" y="0" width="21" height="3"/>
      <rect x="0" y="3" width="3" height="3"/>
      <rect x="18" y="3" width="3" height="3"/>
      <rect x="0" y="6" width="3" height="3"/>
      <rect x="18" y="6" width="3" height="3"/>
      <rect x="0" y="9" width="21" height="3"/>
      <rect x="0" y="12" width="3" height="3"/>
      <rect x="18" y="12" width="3" height="3"/>
      <rect x="0" y="15" width="3" height="3"/>
      <rect x="6" y="15" width="9" height="3"/>
      <rect x="18" y="15" width="3" height="3"/>
      <rect x="0" y="18" width="3" height="3"/>
      <rect x="6" y="18" width="9" height="3"/>
      <rect x="18" y="18" width="3" height="3"/>
      <rect x="0" y="21" width="21" height="3"/>
    </g>
    <!-- label window -->
    <rect x="6" y="6" width="9" height="6" fill="#5b3fb8"/>
    <!-- save-tab notch -->
    <rect x="9" y="0" width="3" height="3" fill="#0ea5e9"/>
  </g>
</svg>
